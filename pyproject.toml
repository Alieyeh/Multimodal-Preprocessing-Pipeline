[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-preprocessing"
version = "0.5.0"
description = "Reproducible multimodal preprocessing pipeline for HAR, EEG, and ECG datasets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alieyeh"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
physio = [
  "wfdb>=4.1",
  "mne>=1.6",
  "scipy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
